<style>
  :root{
    --bg:#0d1017; --panel:#161b26; --panel2:#1c2230; --line:#2a3242; --line2:#39435a;
    --text:#e8ecf3; --dim:#8a94a6; --ksr:#4fd6b8; --jtr:#f0a742; --accent:#7c9cff;
    --madrid:#7c9cff; --asturias:#c98bdb;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:40px;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  ::selection{background:var(--accent);color:#0d1017;}
  button{cursor:pointer;font-family:inherit;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  header{padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:flex-start;}
  .eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);font-weight:600;font-family:var(--mono);}
  .month-row{display:flex;align-items:center;gap:4px;margin-top:6px;}
  h1{font-family:var(--display);font-size:32px;font-weight:700;margin:0;letter-spacing:-.5px;min-width:150px;text-align:center;}
  .arrow{background:none;border:none;color:var(--dim);font-size:28px;line-height:1;padding:0 6px;font-family:var(--display);}
  .save-pill{font-size:11px;font-family:var(--mono);transition:opacity .3s;margin-top:6px;min-height:14px;}
  .save-pill.ok{color:var(--ksr);} .save-pill.err{color:#ff6b6b;} .save-pill.busy{color:var(--dim);}

  .tabs{display:flex;gap:4px;padding:0 16px;margin-bottom:8px;}
  .tab{flex:1;background:none;border:none;color:var(--dim);padding:10px 4px;font-size:13px;font-weight:600;border-bottom:2px solid transparent;}
  .tab.on{color:var(--text);border-bottom:2px solid var(--accent);}

  main{padding:8px 16px 0;}
  .stack{display:flex;flex-direction:column;gap:14px;}

  .hero{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:22px 20px;}
  .hero-label{font-size:12px;color:var(--dim);font-weight:500;}
  .hero-big{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-1px;margin:6px 0 10px;}
  .hero-split{display:flex;gap:10px;font-size:14px;font-family:var(--mono);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;}
  .card-title{font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-family:var(--mono);}
  .card-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .note{font-size:12.5px;color:var(--dim);line-height:1.5;margin:8px 0 14px;}

  .pat-row{display:flex;gap:12px;margin-top:14px;}
  .pat-block{flex:1;background:var(--panel2);border-radius:12px;padding:12px 14px;}
  .pat-name{font-size:13px;font-weight:700;font-family:var(--mono);}
  .pat-val{font-family:var(--display);font-size:20px;font-weight:600;margin-top:4px;letter-spacing:-.5px;}
  .pat-total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--dim);}

  table{width:100%;border-collapse:collapse;margin-top:12px;}
  th.l{text-align:left;} th.r{text-align:right;}
  th{font-size:11px;color:var(--dim);font-weight:600;padding:0 0 8px;}
  td.l{text-align:left;font-size:13.5px;padding:9px 0;border-top:1px solid var(--line);}
  td.r{text-align:right;font-size:13.5px;padding:9px 0 9px 8px;border-top:1px solid var(--line);font-family:var(--mono);}

  .cuenta{background:var(--panel2);border-radius:12px;padding:14px;margin-top:12px;}
  .cuenta-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .cuenta-name{font-size:14px;font-weight:700;}
  .cuenta-sub{font-size:11.5px;color:var(--dim);margin-top:2px;}
  .cuenta-total{font-family:var(--display);font-size:20px;font-weight:600;}

  .bar-val{font-size:12.5px;font-family:var(--mono);width:78px;text-align:right;flex-shrink:0;}

  .segment{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:12px;border:1px solid var(--line);}
  .seg-btn{flex:1;background:none;border:none;color:var(--dim);padding:10px 4px;border-radius:8px;font-size:14px;font-weight:700;font-family:var(--mono);transition:all .2s;}

  .chip{font-size:13px;font-family:var(--mono);font-weight:700;border:1px solid;border-radius:20px;padding:3px 12px;}
  .input-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);}
  .input-label{font-size:13.5px;flex:1;}
  .input-wrap{position:relative;width:120px;flex-shrink:0;}
  .input-wrap input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:15px;font-family:var(--mono);padding:9px 26px 9px 12px;text-align:right;}
  .input-eur{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none;}

  .foot-note{font-size:12px;color:var(--dim);text-align:center;margin:2px 0 0;}
  .prog-outer{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px;}
  .prog-inner{height:10px;border-radius:6px;transition:width .4s;}

  .kpi-row{display:flex;gap:8px;margin-top:12px;}
  .kpi{flex:1;background:var(--panel2);border-radius:10px;padding:10px 8px;text-align:center;}
  .kpi-l{display:block;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono);}
  .kpi-v{display:block;font-family:var(--display);font-size:16px;font-weight:600;margin-top:4px;letter-spacing:-.3px;}
  .cpt{padding:11px 0;border-top:1px solid var(--line);}
  .cpt-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .cpt-name{font-size:13.5px;flex:1;}
  .cpt-acum{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.3px;flex-shrink:0;}
  .cpt-add{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .input-wrap.add{flex:1;width:auto;}
  .add-btn{width:44px;height:40px;border:none;border-radius:9px;color:#0d1017;font-size:22px;font-weight:700;line-height:1;flex-shrink:0;display:grid;place-items:center;font-family:var(--display);}
  .add-btn:active{transform:scale(.94);}
  .cpt-bar{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .cpt-bud{font-size:11px;font-family:var(--mono);color:var(--dim);white-space:nowrap;flex-shrink:0;}
  .ahorro-mes{background:var(--panel2);border-radius:12px;padding:14px;margin-top:12px;}
  .ahorro-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .rep-row{display:flex;justify-content:space-between;font-size:12.5px;font-family:var(--mono);}

  .aho-desv{display:flex;justify-content:space-between;font-size:12px;font-family:var(--mono);margin-top:12px;padding-top:10px;border-top:1px solid var(--line);}
  .setup{padding:30px 22px;}
  .setup h2{font-family:var(--display);font-size:22px;margin:0 0 8px;}
  .setup p{font-size:14px;color:var(--dim);line-height:1.6;}
  .setup input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:14px;padding:12px;margin:12px 0;font-family:var(--mono);}
  .setup button{width:100%;background:var(--accent);color:#0d1017;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;}
  .loading{display:grid;place-items:center;min-height:100vh;color:var(--dim);font-family:var(--mono);}
</style>
</head>

const ES_CASA = amb => (amb==="MADRID"||amb==="ASTURIAS"||amb==="CASAS");
const CONCEPTO_KEYS = amb => CONCEPTOS[amb].map(c=>c[0]);
// budget de un concepto: si es número, fijo; si es objeto {mes:val}, según el mes
const budgetConcepto = (amb,concepto,mes) => {
  const f=CONCEPTOS[amb].find(c=>c[0]===concepto);
  if(!f) return 0;
  return (typeof f[1]==="object") ? (f[1][mes]||0) : f[1];
};
const budgetConceptoVal = (bud,mes) => (typeof bud==="object") ? (bud[mes]||0) : bud;
const budgetTotal = (amb,mes) => CONCEPTOS[amb].reduce((t,c)=>t+budgetConceptoVal(c[1],mes),0);

  scriptUrl: SCRIPT_URL || localStorage.getItem("cg_url") || "",

  cargando: true,
};

const key = (mes, ambito, concepto) => `${ANIO}:${mes}:${ambito}:${concepto}`;
// Acepta coma o punto como separador decimal (teclado español)
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; };
const getGasto = (mes, ambito, concepto) => num(state.gastos[key(mes,ambito,concepto)] || 0);

function totalAmbito(mes, ambito){
  return CONCEPTO_KEYS(ambito).reduce((t,c)=>t+getGasto(mes,ambito,c),0);
}
// Consumo de "caprichos" derivado de los conceptos:
//  - concepto sin budget (budget 0): todo el gasto consume caprichos
//  - concepto con budget: solo el EXCESO sobre su budget consume caprichos
function consumoDesdeConceptos(mes, persona){
  return CONCEPTOS[persona].reduce((t,[c,bud])=>{
    const g = getGasto(mes,persona,c);
    return t + (bud>0 ? Math.max(0, g-bud) : g);
  },0);
}
// Gasto de caprichos manual directo (bloque "gasto en caprichos")
function gastoCaprichosManual(mes, persona){ return getGasto(mes, "CAP_"+persona, "Caprichos"); }
// Total consumido de caprichos = manual + derivado de conceptos
function gastoCaprichos(mes, persona){ return gastoCaprichosManual(mes,persona) + consumoDesdeConceptos(mes,persona); }

// ══════════════════════════════════════════════════════════════════════════
//  RED
// ══════════════════════════════════════════════════════════════════════════
async function cargarGastos(){
  if(!state.scriptUrl) return;
  try{
    const r = await fetch(state.scriptUrl);
    const data = await r.json();
    if(data.ok){
      const g = {};
      for(const x of data.gastos){
        g[`${x.anio}:${x.mesIndice}:${x.ambito}:${x.concepto}`] = x.importe;
      }
      state.gastos = g;
    }
  }catch(e){ /* sin conexión: usa lo que haya */ }
}

let saveTimer = null;
function guardarGasto(mes, ambito, concepto, importe){
  state.gastos[key(mes,ambito,concepto)] = importe;
  if(!state.scriptUrl){ setSave("err"); return; }
  setSave("busy");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await fetch(state.scriptUrl, {
        method:"POST",
        body: JSON.stringify({ anio:ANIO, mesIndice:mes, ambito, concepto,
                               importe:num(importe), autor:state.autor }),
      });
      setSave("ok");
      setTimeout(()=>setSave(""),1400);
    }catch(e){ setSave("err"); }
  }, 600);
}

function setSave(s){ state.saveState = s; const el=document.querySelector(".save-pill"); if(el){el.className="save-pill "+s; el.textContent = s==="ok"?"Guardado ✓":s==="busy"?"Guardando…":s==="err"?"Sin conexión":"";} }

// ══════════════════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════════════════
function render(){
  const app = document.getElementById("app");

  if(state.cargando){ app.innerHTML = `<div class="loading">Cargando…</div>`; return; }

  // Primera vez: pedir URL + nombre
  if(!state.scriptUrl || !state.autor){
    app.innerHTML = vistaSetup();
    return;
  }

  app.innerHTML = `
    <header>
      <div>
        <div class="eyebrow">Control de gastos · KSR + JTR</div>
        <div class="month-row">
          <button class="arrow" onclick="cambiarMes(-1)" aria-label="Mes anterior">‹</button>
          <h1>${MESES[state.mes]}</h1>
          <button class="arrow" onclick="cambiarMes(1)" aria-label="Mes siguiente">›</button>
        </div>
      </div>
      <div class="save-pill ${state.saveState}">${state.saveState==="ok"?"Guardado ✓":state.saveState==="busy"?"Guardando…":state.saveState==="err"?"Sin conexión":""}</div>
    </header>
    <nav class="tabs">
      ${[["resumen","Resumen"],["reparto","Reparto"],["gastos","Gastos"],["ahorro","Ahorro"]]
        .map(([k,l])=>`<button class="tab ${state.tab===k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("")}
    </nav>
    <main>${
      state.tab==="resumen"?vistaResumen():
      state.tab==="reparto"?vistaReparto():
      state.tab==="gastos"?vistaGastos():
      vistaAhorro()
    }</main>
  `;
}

function vistaSetup(){
  return `<div class="setup">
    <h2>Conecta la app</h2>
    <p>Pega la URL de tu Google Apps Script (la de la guía) y pon tu nombre. Se guarda en este móvil; solo hace falta una vez.</p>
    <input id="su-url" placeholder="https://script.google.com/macros/s/…/exec" value="${state.scriptUrl||""}" />
    <input id="su-autor" placeholder="Tu nombre (Kevin / Juliette)" value="${state.autor||""}" />
    <button onclick="guardarSetup()">Entrar</button>
  </div>`;
}

function vistaResumen(){
  const v = VIVIENDA[state.mes];
  const totalConjunto = v.ksr + v.jtr;
  const patKSR = patrimonio("KSR"), patJTR = patrimonio("JTR");
  return `<div class="stack">
    <section class="hero">
      <div class="hero-label">Vivienda conjunta → cuentas del hogar</div>
      <div class="hero-big">${eur(totalConjunto)}</div>
      <div class="hero-split">
        <span><b style="color:var(--ksr)">KSR</b> ${eur(v.ksr)}</span>
        <span style="color:var(--line)">·</span>
        <span><b style="color:var(--jtr)">JTR</b> ${eur(v.jtr)}</span>
      </div>
    </section>

    <section class="card">
      <div class="card-title">Gasto del mes registrado</div>
      <div class="pat-row">
        ${["KSR","JTR"].map(a=>bloqueGastoMes(a)).join("")}
      </div>
      <div class="pat-row" style="margin-top:12px;">
        ${["MADRID","ASTURIAS","CASAS"].map(a=>bloqueGastoMes(a)).join("")}
      </div>
    </section>

    <section class="card">
      <div class="card-title">Patrimonio de ahorro acumulado</div>
      <div class="pat-row">
        <div class="pat-block"><div class="pat-name" style="color:var(--ksr)">KSR</div><div class="pat-val">${eur(patKSR)}</div></div>
        <div class="pat-block"><div class="pat-name" style="color:var(--jtr)">JTR</div><div class="pat-val">${eur(patJTR)}</div></div>
      </div>
      <div class="pat-total"><span>Total conjunto</span><b>${eur(patKSR+patJTR)}</b></div>
    </section>
  </div>`;
}

function bloqueGastoMes(ambito){
  const t = totalAmbito(state.mes, ambito);
  const esPersona = (ambito==="KSR"||ambito==="JTR");
  const totalPersona = esPersona ? t + gastoCaprichos(state.mes, ambito) : t;
  const bud = esPersona ? budgetTotal(ambito, state.mes) + (CAPRICHOS[ambito][state.mes]||0) : budgetTotal(ambito, state.mes);
  const sub = bud>0 ? `de ${eur0(bud)}` : "";
  return `<div class="pat-block">
    <div class="pat-name" style="color:${AMBITO_COLOR[ambito]}">${AMBITO_LABEL[ambito]}</div>
    <div class="pat-val">${eur(totalPersona)}</div>
    ${sub?`<div style="font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:2px">${sub}</div>`:""}
  </div>`;
}

function vistaReparto(){
  const v = VIVIENDA[state.mes];
  const madridTotal = v.madridKsr + v.madridJtr;
  return `<div class="stack">
    <section class="card">
      <div class="card-title">Reparto por cuentas bancarias</div>
      <p class="note">KSR paga íntegra la cuenta de Asturias; el resto de su aportación va a Madrid. JTR pone toda su aportación en Madrid.</p>
      ${cuentaCard("Cuenta ASTURIAS","La paga íntegra KSR",v.asturias,[["KSR aporta",v.asturias,"var(--ksr)"],["JTR aporta",0,"var(--jtr)"]])}
      ${cuentaCard("Cuenta MADRID","JTR + resto de KSR",madridTotal,[["KSR aporta",v.madridKsr,"var(--ksr)"],["JTR aporta",v.madridJtr,"var(--jtr)"]])}
    </section>
    <section class="card">
      <div class="card-title">Total que transfiere cada uno</div>
      <div class="pat-row">
        <div class="pat-block" style="text-align:center"><div class="pat-name" style="color:var(--ksr)">KSR</div><div class="pat-val" style="font-size:24px">${eur(v.ksr)}</div></div>
        <div class="pat-block" style="text-align:center"><div class="pat-name" style="color:var(--jtr)">JTR</div><div class="pat-val" style="font-size:24px">${eur(v.jtr)}</div></div>
      </div>
    </section>
  </div>`;
}

function cuentaCard(nombre,sub,total,filas){
  return `<div class="cuenta">
    <div class="cuenta-head">
      <div><div class="cuenta-name">${nombre}</div><div class="cuenta-sub">${sub}</div></div>
      <div class="cuenta-total">${eur(total)}</div>
    </div>
    ${filas.map(([l,val,col])=>`
      <div class="bar-row">
        <span class="bar-label">${l}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${total?(val/total*100):0}%;background:${col}"></div></div>
        <span class="bar-val">${eur(val)}</span>
      </div>`).join("")}
  </div>`;
}

function vistaGastos(){
  const a = state.ambito;
  const col = AMBITO_COLOR[a];
  const esPersona = (a==="KSR"||a==="JTR");
  const esCasa = ES_CASA(a);
  const gastado = totalAmbito(state.mes, a);
  const bud = budgetTotal(a, state.mes);
  const desv = gastado - bud;

  return `<div class="stack">
    <div class="segment seg-wrap">
      ${["KSR","JTR","MADRID","ASTURIAS","CASAS"].map(x=>`
        <button class="seg-btn" style="${state.ambito===x?`background:${AMBITO_COLOR[x]};color:#0d1017`:""}" onclick="setAmbito('${x}')">
          ${x==="MADRID"?"Madrid":x==="ASTURIAS"?"Asturias":x==="CASAS"?"Casas":x}
        </button>`).join("")}
    </div>

    <!-- Resumen: budget vs gastado vs desviación -->
    <section class="card">
      <div class="card-title">${AMBITO_LABEL[a]} · ${MESES_CORTO[state.mes]}</div>
      <div class="kpi-row">
        <div class="kpi"><span class="kpi-l">Budget mes</span><span class="kpi-v">${eur(bud)}</span></div>
        <div class="kpi"><span class="kpi-l">Gastado</span><span class="kpi-v" style="color:${col}">${eur(gastado)}</span></div>
        <div class="kpi"><span class="kpi-l">Desviación</span><span class="kpi-v" style="color:${desv>0?'#ff6b6b':'var(--ksr)'}">${desv>0?'+':''}${eur(desv)}</span></div>
      </div>
      <div class="prog-outer"><div class="prog-inner" style="width:${bud?Math.min(gastado/bud*100,100):0}%;background:${desv>0?'#ff6b6b':col}"></div></div>
    </section>

    ${esPersona ? bloqueCaprichos(a, col) : ""}

    <!-- Conceptos con barra de progreso -->
    <section class="card">
      <div class="card-title">${esCasa?"Conceptos":"Conceptos variables y extras"}</div>
      <div style="margin-top:10px">
        ${CONCEPTOS[a].map(([c,budRaw],i)=>{
          const bc = budgetConceptoVal(budRaw, state.mes);
          const g = getGasto(state.mes,a,c);
          const pct = bc? Math.min(g/bc*100,100) : (g>0?100:0);
          const over = bc>0 && g>bc;
          let nota;
          if(bc>0){
            const exceso = Math.max(0,g-bc);
            nota = `${eur(g)} / ${eur(bc)}` + (over? (esCasa?` · +${eur(exceso)} sobre budget`:` · +${eur(exceso)} caprichos`):"");
          } else {
            nota = esCasa ? (g>0?`${eur(g)} · sin budget`:"sin budget este mes")
                          : (g>0?`${eur(g)} · caprichos`:"va a caprichos");
          }
          const inputId = `in_${a}_${i}`;
          return `<div class="cpt">
            <div class="cpt-top">
              <span class="cpt-name">${c}</span>
              <span class="cpt-acum" style="color:${g>0?(over?'#ff6b6b':col):'var(--dim)'}">${eur(g)}</span>
            </div>
            <div class="cpt-add">
              <div class="input-wrap add">
                <input id="${inputId}" type="text" inputmode="decimal" placeholder="+ añadir"
                  onkeydown="onKeyGasto(event,'${a}','${c.replace(/'/g,"\\'")}','${inputId}')" />
                <span class="input-eur">€</span>
              </div>
              <button class="add-btn" style="background:${col}" onclick="anadirGasto('${a}','${c.replace(/'/g,"\\'")}','${inputId}')">+</button>
            </div>
            <div class="cpt-bar">
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${over?'#ff6b6b':(bc>0?col:(esCasa?'var(--dim)':'var(--accent)'))}"></div></div>
              <span class="cpt-bud">${nota}</span>
            </div>
          </div>`;
        }).join("")}
      </div>
    </section>

    <p class="foot-note">Se guarda en el Sheet y lo ve ${esPersona?"el otro":"los dos"} al instante.</p>
  </div>`;
}

function bloqueCaprichos(persona, col){
  const limite = CAPRICHOS[persona][state.mes] || 0;
  const desdeConceptos = consumoDesdeConceptos(state.mes, persona);
  const manual = gastoCaprichosManual(state.mes, persona);
  const g = desdeConceptos + manual;
  const restante = limite - g;
  const pct = limite? Math.min(g/limite*100,100) : 0;
  const over = g>limite;
  const k = key(state.mes,"CAP_"+persona,"Caprichos");
  const val = state.gastos[k] ?? "";
  return `<section class="card">
    <div class="card-title">Caprichos del mes · lo libre para gastar</div>
    <div class="kpi-row">
      <div class="kpi"><span class="kpi-l">Límite</span><span class="kpi-v">${eur(limite)}</span></div>
      <div class="kpi"><span class="kpi-l">Consumido</span><span class="kpi-v" style="color:${col}">${eur(g)}</span></div>
      <div class="kpi"><span class="kpi-l">${restante>=0?'Queda':'Excedido'}</span><span class="kpi-v" style="color:${restante<0?'#ff6b6b':'var(--ksr)'}">${eur(Math.abs(restante))}</span></div>
    </div>
    <div class="prog-outer"><div class="prog-inner" style="width:${pct}%;background:${over?'#ff6b6b':col}"></div></div>
    ${desdeConceptos>0?`<div class="aho-desv" style="border-top:none;margin-top:8px;padding-top:0"><span>De conceptos sin budget / excesos</span><b>${eur(desdeConceptos)}</b></div>`:""}
    <div class="cpt" style="border-top:1px solid var(--line);margin-top:8px">
      <div class="cpt-top">
        <span class="cpt-name">Otros caprichos (directo)</span>
        <span class="cpt-acum" style="color:${manual>0?col:'var(--dim)'}">${eur(manual)}</span>
      </div>
      <div class="cpt-add">
        <div class="input-wrap add">
          <input id="in_capman_${persona}" type="text" inputmode="decimal" placeholder="+ añadir"
            onkeydown="onKeyGasto(event,'CAP_${persona}','Caprichos','in_capman_${persona}')" />
          <span class="input-eur">€</span>
        </div>
        <button class="add-btn" style="background:${col}" onclick="anadirGasto('CAP_${persona}','Caprichos','in_capman_${persona}')">+</button>
      </div>
    </div>
  </section>`;
}

// Un destino de ahorro: objetivo + acumulado + botón para sumar
function destinoAhorro(persona, idx, label, objetivo, col){
  const concepto = idx===0 ? "Openbank" : "Segundo";
  const real = getGasto(state.mes, "AHO_"+persona, concepto);
  const pct = objetivo ? Math.min(real/objetivo*100,100) : (real>0?100:0);
  const inputId = `in_aho_${persona}_${idx}`;
  return `<div style="margin-top:14px">
    <div class="rep-row" style="margin-bottom:6px">
      <span>${label}</span>
      <span style="color:var(--dim)">${eur(real)} / obj. ${eur(objetivo)}</span>
    </div>
    <div class="bar-track" style="margin-bottom:8px"><div class="bar-fill" style="width:${pct}%;background:${col};${idx===1?'opacity:.6':''}"></div></div>
    <div class="cpt-add">
      <div class="input-wrap add">
        <input id="${inputId}" type="text" inputmode="decimal" placeholder="+ añadir"
          onkeydown="onKeyGasto(event,'AHO_${persona}','${concepto}','${inputId}')" />
        <span class="input-eur">€</span>
      </div>
      <button class="add-btn" style="background:${col}" onclick="anadirGasto('AHO_${persona}','${concepto}','${inputId}')">+</button>
    </div>
  </div>`;
}

// Resumen de desviación total del ahorro real vs objetivo del mes
function resumenDesviacionAhorro(persona, par, col){
  const objetivo = par[0]+par[1];
  const real = getGasto(state.mes,"AHO_"+persona,"Openbank") + getGasto(state.mes,"AHO_"+persona,"Segundo");
  const desv = real - objetivo;
  if(real===0) return "";
  return `<div class="aho-desv">
    <span>Metido ${eur(real)}</span>
    <span style="color:${desv<0?'#ff6b6b':'var(--ksr)'}">${desv>=0?'+':''}${eur(desv)} vs objetivo</span>
  </div>`;
}

function vistaAhorro(){
  return `<div class="stack">
    <!-- Ahorro del mes: qué mete cada uno y a dónde -->
    <section class="card">
      <div class="card-title">Ahorro a enviar este mes · ${MESES[state.mes]}</div>
      <p class="note">Objetivo de cada destino y lo que metéis de verdad, con la desviación. Openbank (70%) y el segundo destino (30%).</p>
      ${["KSR","JTR"].map(p=>{
        const col = p==="KSR"?"var(--ksr)":"var(--jtr)";
        const rep = AHORRO_REPARTO[p];
        const par = rep[state.mes];
        const total = par ? par[0]+par[1] : 0;
        if(!par){
          return `<div class="ahorro-mes">
            <div class="ahorro-head"><span class="pat-name" style="color:${col}">${p}</span><span class="cuenta-sub">Mes de referencia (no cuenta desde Ago)</span></div>
          </div>`;
        }
        return `<div class="ahorro-mes">
          <div class="ahorro-head">
            <span class="pat-name" style="color:${col}">${p}</span>
            <div style="text-align:right">
              <b style="font-family:var(--display);font-size:19px">${eur(total)}</b>
              <div style="font-size:10.5px;color:var(--dim);font-family:var(--mono)">objetivo del mes</div>
            </div>
          </div>
          ${destinoAhorro(p, 0, rep.label1, par[0], col)}
          ${destinoAhorro(p, 1, rep.label2, par[1], col)}
          ${resumenDesviacionAhorro(p, par, col)}
        </div>`;
      }).join("")}
    </section>

    <!-- Patrimonio acumulado -->
    <section class="card">
      <div class="card-title">Patrimonio total acumulado</div>
      <p class="note">Saldo real a 1-Ago 2026 más el ahorro enviado hasta ${MESES[state.mes]}.</p>
      ${["KSR","JTR"].map(p=>{
        const col = p==="KSR"?"var(--ksr)":"var(--jtr)";
        const ini = SALDO_INICIAL[p];
        const env = ahorroAcumulado(p, state.mes);
        const tot = ini+env;
        return `<div style="margin-top:16px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
            <span class="pat-name" style="color:${col}">${p}</span>
            <b style="font-family:var(--display);font-size:20px;font-weight:600">${eur(tot)}</b>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:8px;font-family:var(--mono)">
            <span>Saldo inicial ${eur0(ini)}</span><span style="color:${col}">+ ${eur0(env)} enviado</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${tot?(env/tot*100):0}%;background:${col}"></div></div>
        </div>`;
      }).join("")}
      <div class="pat-total"><span>Total conjunto</span><b>${eur(patrimonio("KSR")+patrimonio("JTR"))}</b></div>
    </section>
  </div>`;
}

// patrimonio a fecha del mes seleccionado
function ahorroAcumulado(persona, mes){
  let t=0;
  for(let m=7;m<=mes;m++){ t += (AHORRO_MES[persona]?.[m])||0; }
  return t;
}
function patrimonio(persona){ return SALDO_INICIAL[persona] + ahorroAcumulado(persona, state.mes); }

// ══════════════════════════════════════════════════════════════════════════
//  EVENTOS
// ══════════════════════════════════════════════════════════════════════════
function cambiarMes(d){ state.mes = (state.mes + d + 12) % 12; render(); }
function setTab(t){ state.tab = t; render(); }
function setAmbito(a){ state.ambito = a; render(); }
function onGasto(ambito, concepto, val){ guardarGasto(state.mes, ambito, concepto, val); }

// Suma un nuevo importe al acumulado de una partida y limpia el campo
function anadirGasto(ambito, concepto, inputId){
  const el = document.getElementById(inputId);
  if(!el) return;
  const nuevo = num(el.value);
  if(!nuevo){ el.value=""; return; }
  const actual = getGasto(state.mes, ambito, concepto);
  const total = Math.round((actual + nuevo) * 100) / 100;
  guardarGasto(state.mes, ambito, concepto, total);
  el.value = "";
  render();
}
// Permite sumar también con Enter
function onKeyGasto(e, ambito, concepto, inputId){
  if(e.key === "Enter"){ e.preventDefault(); anadirGasto(ambito, concepto, inputId); }
}

function guardarSetup(){
  const url = document.getElementById("su-url").value.trim();
  const autor = document.getElementById("su-autor").value.trim();
  if(!url || !autor){ return; }
  state.scriptUrl = url; state.autor = autor;
  localStorage.setItem("cg_url", url);
  localStorage.setItem("cg_autor", autor);
  init();
}

async function init(){
  state.cargando = true; render();
  await cargarGastos();
  state.cargando = false; render();
  // refresco periódico para ver lo que mete el otro
  setInterval(async ()=>{ await cargarGastos(); if(state.tab==="resumen"||state.tab==="gastos") render(); }, 20000);
}

init();
</script>
</body>
</html>
